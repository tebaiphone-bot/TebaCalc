<style>
/* Layout: one-column phone app; order blocks stacked (client, prints, files, costs), live price bar pinned at the bottom, four-tab bar under it. */
:root {
  --bg: #0f1311;
  --surface: #181d1a;
  --field: #222924;
  --line: #2c352f;
  --fg: #e8eee9;
  --muted: #8e9a92;
  --accent: #1fd16b;
  --accent-ink: #04140a;
  --danger: #ff6b5e;
  --f-display: "Chakra Petch", "Rajdhani", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 190px;
}
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.brand { font-family: var(--f-display); font-size: 28px; letter-spacing: .04em; font-weight: 500; margin: 0; line-height: 1; }
.brand b { color: var(--accent); font-weight: 700; }
.brand small { display: block; font-family: var(--f-body); font-size: 11px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; margin-top: 6px; }
.example-note { font-size: 12px; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 16px; }

section.view { display: grid; gap: 22px; }
.block { display: grid; gap: 10px; }
.block > h2 {
  margin: 0; font-family: var(--f-display); font-size: 14px; font-weight: 600; letter-spacing: .16em;
  text-transform: uppercase; color: var(--accent);
}
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 360px) { .grid3 { grid-template-columns: 1fr 1fr; } }
label.f { display: grid; gap: 5px; min-width: 0; }
label.f > span { font-size: 12.5px; color: var(--muted); }
input, select {
  width: 100%; min-width: 0; font: inherit; color: var(--fg); background: var(--field); border: 1px solid transparent;
  border-radius: 10px; padding: 11px 12px; outline: none;
}
input[type=number], .num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
input:focus-visible, select:focus-visible, button:focus-visible { border-color: var(--accent); outline: 2px solid color-mix(in srgb, var(--accent) 40%, transparent); outline-offset: 1px; }
input[type=color] { padding: 3px; height: 44px; }
.unit { position: relative; }
.unit input { padding-right: 46px; }
.unit em { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-style: normal; font-size: 12px; color: var(--muted); pointer-events: none; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }

button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; color: var(--fg); background: var(--field); padding: 10px 14px; }
button.primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
button.ghost { background: transparent; border: 1px dashed color-mix(in srgb, var(--accent) 60%, transparent); color: var(--accent); width: 100%; padding: 12px; font-weight: 600; }
button.icon { background: transparent; color: var(--muted); padding: 6px 8px; font-size: 18px; line-height: 1; }
button.danger { color: var(--danger); background: transparent; }
button.danger.armed { background: var(--danger); color: #1a0402; }

.fil { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }
.fil-head { display: flex; align-items: center; gap: 10px; }
.dot { width: 16px; height: 16px; border-radius: 50%; flex: none; border: 2px solid var(--line); }
.fil-head select { flex: 1; }

/* Price bar */
.pricebar {
  position: fixed; left: 0; right: 0; bottom: calc(58px + env(safe-area-inset-bottom, 0px)); z-index: 5;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.pricebar .inner {
  max-width: 560px; margin: 0 auto; background: var(--accent); color: var(--accent-ink); border-radius: 16px;
  padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  box-shadow: 0 8px 28px color-mix(in srgb, var(--accent) 30%, transparent);
}
.pricebar .lbl { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; opacity: .75; }
.pricebar .big { font-family: var(--f-num); font-size: 24px; font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; }
.pricebar .unitp { font-size: 12px; opacity: .8; font-family: var(--f-num); }
.pricebar button { background: var(--accent-ink); color: var(--accent); font-weight: 600; white-space: nowrap; }

nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
nav.tabs .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
nav.tabs button { background: transparent; border-radius: 0; padding: 10px 4px 12px; color: var(--muted); font-size: 12.5px; display: grid; justify-items: center; gap: 3px; height: 58px; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-current=true] { color: var(--accent); }

/* Breakdown sheet */
.sheet-bg { position: fixed; inset: 0; background: rgb(0 0 0 / .6); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--surface); border-radius: 18px 18px 0 0; width: 100%; max-width: 560px; max-height: 88%; overflow: auto;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 14px; border: 1px solid var(--line);
}
.sheet h3 { margin: 0; font-family: var(--f-display); font-size: 20px; }
.rows { display: grid; }
.row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.row > span:last-child { font-family: var(--f-num); font-variant-numeric: tabular-nums; text-align: right; }
.row.sub { font-weight: 600; }
.row.total { border-bottom: 0; font-size: 18px; color: var(--accent); font-weight: 600; padding-top: 10px; }
.row .d { color: var(--muted); font-size: 12px; display: block; font-family: var(--f-body); }
.bar { display: flex; height: 10px; border-radius: 6px; overflow: hidden; background: var(--field); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.actions button { flex: 1 1 120px; }

/* Lists */
.list { display: grid; gap: 8px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 4px; }
.item .t { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.item .t b { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.item .t span { font-family: var(--f-num); color: var(--accent); white-space: nowrap; }
.item .s { font-size: 12.5px; color: var(--muted); }
.item .a { display: flex; gap: 6px; justify-content: flex-end; margin-top: 4px; }
.item .a button { padding: 6px 10px; font-size: 13px; }
.empty { color: var(--muted); font-size: 14px; text-align: center; padding: 24px 8px; border: 1px dashed var(--line); border-radius: 12px; }
.syms { display: flex; flex-wrap: wrap; gap: 8px; }
.syms button { min-width: 44px; font-family: var(--f-num); font-size: 17px; }
.syms button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(140px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 30; font-size: 14px; max-width: 90%; }
textarea.copy { width: 100%; min-height: 160px; font: 13px var(--f-num); background: var(--field); color: var(--fg); border: 0; border-radius: 10px; padding: 10px; }
.ver { text-align: center; color: var(--muted); font-size: 12px; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }
</style>
<style>
[hidden] { display: none !important; }
nav.tabs .inner { grid-template-columns: repeat(4, 1fr); }
.print { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.print-head { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; background: transparent; border-radius: 0; padding: 12px; }
.print-head .pn { flex: 1; min-width: 0; display: grid; gap: 2px; }
.print-head .pn b { font-weight: 600; overflow-wrap: anywhere; }
.print-head .pn small { color: var(--muted); font-size: 12.5px; }
.print-head .pc { font-family: var(--f-num); color: var(--accent); white-space: nowrap; font-size: 14px; }
.print-head .chev { color: var(--muted); transition: transform .15s; }
.print[data-open="true"] .print-head .chev { transform: rotate(90deg); }
.print-body { display: grid; gap: 12px; padding: 0 12px 12px; }
.print-foot { display: flex; gap: 8px; justify-content: flex-end; }
.print-foot button { padding: 7px 12px; font-size: 13px; }
.row-btn { display: flex; gap: 8px; align-items: end; }
.row-btn label.f { flex: 1; }
.row-btn button { height: 46px; white-space: nowrap; }
.files { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.file { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 10px; overflow: hidden; background: var(--field); border: 1px solid var(--line); display: grid; place-items: center; }
.file img { width: 100%; height: 100%; object-fit: cover; display: block; }
.file .doc { padding: 8px; font-size: 11.5px; color: var(--muted); text-align: center; overflow-wrap: anywhere; display: grid; gap: 4px; }
.file .doc b { font-family: var(--f-display); color: var(--fg); font-size: 15px; }
.file button { position: absolute; top: 4px; right: 4px; padding: 2px 7px; font-size: 13px; border-radius: 8px; background: rgb(0 0 0 / .65); color: #fff; }
.file button.armed { background: var(--danger); color: #1a0402; }
.file-add { display: flex; gap: 8px; flex-wrap: wrap; }
.file-add label { flex: 1 1 140px; cursor: pointer; text-align: center; border: 1px dashed color-mix(in srgb, var(--accent) 60%, transparent); color: var(--accent); border-radius: 10px; padding: 11px; font-weight: 600; }
.file-add input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.wa { background: #25d366; color: #052e14; font-weight: 600; text-align: center; text-decoration: none; border-radius: 10px; padding: 11px 14px; display: block; }
.check { display: flex; gap: 10px; align-items: center; padding: 6px 0; }
.check input { width: 20px; height: 20px; flex: none; accent-color: var(--accent); }
textarea.msg { width: 100%; min-height: 170px; font: 14px/1.45 var(--f-body); background: var(--field); color: var(--fg); border: 0; border-radius: 10px; padding: 10px; resize: vertical; }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumbs label { display: flex; align-items: center; gap: 6px; background: var(--field); border-radius: 8px; padding: 4px 8px 4px 4px; font-size: 12.5px; max-width: 100%; }
.thumbs img { width: 36px; height: 36px; object-fit: cover; border-radius: 6px; }
.thumbs input { accent-color: var(--accent); }
.pill { display: inline-block; font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--field); color: var(--muted); }
.sheet form { display: grid; gap: 12px; }
</style>

  // Cost model from the design doc, applied per print, then order-level extras, profit, fee and tax.
  function computePrint(p, o) {
    var beds = Math.max(1, Math.round(num(p.beds)) || 1);
    var hours = (num(p.h) + num(p.m) / 60) * beds;
    var material = 0, grams = 0;
    p.fil.forEach(function (f) { var w = num(f.weight); grams += num(f.g) * beds; if (w > 0) material += num(f.g) * beds * num(f.price) / w; });
    var pr = findPrinter(p.printer);
    var energy = pr ? hours * num(pr.watts) / 1000 * num(o.kwh) : 0;
    var wear = pr ? hours * ((num(pr.life) > 0 ? num(pr.price) / num(pr.life) : 0) + num(pr.maint)) : 0;
    var failCost = (material + energy + wear) * num(p.fail) / 100;
    var labor = (num(p.prep) + num(p.post)) / 60 * num(o.rate);
    var pieces = Math.max(1, Math.round(num(p.qty)) || 1) * beds;
    return { hours: hours, grams: grams, material: material, energy: energy, wear: wear, failCost: failCost, labor: labor,
      cost: material + energy + wear + failCost + labor, pieces: pieces, beds: beds };
  }
  function compute(o) {
    var r = { material: 0, energy: 0, wear: 0, failCost: 0, labor: 0, hours: 0, grams: 0, pieces: 0, printsCost: 0 };
    r.lines = o.prints.map(function (p) {
      var c = computePrint(p, o);
      ["material", "energy", "wear", "failCost", "labor", "hours", "grams", "pieces"].forEach(function (k) { r[k] += c[k]; });
      r.printsCost += c.cost; return c;

    r.supplies = num(o.supplies); r.pack = num(o.pack); r.ship = num(o.ship);
    r.cost = r.printsCost + r.supplies + r.pack;
    r.profitAmt = r.cost * num(o.profit) / 100;
    r.net = r.cost + r.profitAmt;
    var feeRate = Math.min(num(o.fee), 95) / 100;
    r.subtotal = r.net / (1 - feeRate);
    r.feeAmt = r.subtotal - r.net;

  // Quote as a PNG, drawn on a canvas.
  function quoteImage(o) {
    var r = compute(o), s = state.settings, c = findClient(o.clientId);
    var W = 1080, pad = 72, lineH = 58;
    var rows = o.prints.map(function (p, i) { return [printLabel(p, i) + "  x" + r.lines[i].pieces, money(r.lines[i].price)]; });
    var tail = [[t("subtotal"), money(r.subtotal)]];
    if (r.taxAmt) tail.push([(s.taxName || t("taxAmt")) + " " + num(o.tax) + "%", money(r.taxAmt)]);
    if (r.ship) tail.push([t("ship"), money(r.ship)]);
    var H = pad + 150 + (c ? 60 : 0) + 40 + rows.length * lineH + 30 + tail.length * lineH + 140 + pad;
    var cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    var g = cv.getContext("2d");
    g.fillStyle = "#0f1311"; g.fillRect(0, 0, W, H);
    g.fillStyle = "#1fd16b"; g.fillRect(0, 0, W, 12);
    var y = pad + 40;
    g.textBaseline = "alphabetic";
    g.font = "600 52px 'Chakra Petch', system-ui, sans-serif"; g.fillStyle = "#e8eee9";
    g.fillText(s.business || "TebaCalc", pad, y);
    g.font = "400 30px 'IBM Plex Sans', system-ui, sans-serif"; g.fillStyle = "#8e9a92";
    y += 50; g.fillText(t("quote") + " · " + new Date().toLocaleDateString(loc()), pad, y);
    if (o.name) { g.textAlign = "right"; g.fillText(o.name.trim(), W - pad, y); g.textAlign = "left"; }
    y += 60;
    if (c) { g.fillStyle = "#e8eee9"; g.font = "500 34px 'IBM Plex Sans', system-ui, sans-serif"; g.fillText(c.name, pad, y); y += 60; }
    g.strokeStyle = "#2c352f"; g.lineWidth = 2;
    g.beginPath(); g.moveTo(pad, y - 20); g.lineTo(W - pad, y - 20); g.stroke();
    y += 20;
    function line(a, b, color, font) {
      g.font = font || "400 32px 'IBM Plex Sans', system-ui, sans-serif"; g.fillStyle = color || "#e8eee9";
      var maxW = W - pad * 2 - 300, txt = a;
      while (g.measureText(txt).width > maxW && txt.length > 4) txt = txt.slice(0, -2);
      if (txt !== a) txt += "…";
      g.fillText(txt, pad, y);
      g.textAlign = "right"; g.font = "500 32px 'IBM Plex Mono', ui-monospace, monospace"; g.fillText(b, W - pad, y); g.textAlign = "left";
      y += lineH;
    }
    rows.forEach(function (rw) { line(rw[0], rw[1]); });
    g.beginPath(); g.moveTo(pad, y - 30); g.lineTo(W - pad, y - 30); g.stroke();
    y += 10;
    tail.forEach(function (rw) { line(rw[0], rw[1], "#8e9a92"); });
    y += 30;
    g.fillStyle = "#1fd16b"; g.fillRect(pad - 20, y - 70, W - pad * 2 + 40, 110);
    g.fillStyle = "#04140a"; g.font = "600 44px 'Chakra Petch', system-ui, sans-serif"; g.fillText(t("total").toUpperCase(), pad + 10, y);
    g.textAlign = "right"; g.font = "600 48px 'IBM Plex Mono', ui-monospace, monospace"; g.fillText(money(r.total), W - pad - 10, y); g.textAlign = "left";
    var out = document.createElement("canvas"); out.width = W; out.height = Math.min(H, y + 40 + pad);
    var og = out.getContext("2d"); og.fillStyle = "#0f1311"; og.fillRect(0, 0, W, out.height); og.drawImage(cv, 0, 0);
    return new Promise(function (res) { out.toBlob(function (b) { res(b); }, "image/png"); });
  }

    var cf = function (label, key, type, ph) { return '<label class="f"><span>' + esc(label) + '</span><input id="cf-' + key + '" name="' + key + '" type="' + type + '" value="' + esc(c[key]) + '"' + (ph ? ' placeholder="' + esc(ph) + '"' : "") + "></label>"; };
    openSheet("<h3>" + esc(isNew ? t("newClient").replace("+ ", "") : c.name) + "</h3>" +
      '<form id="client-form" data-id="' + esc(c.id) + '">' +
        cf(t("clientName"), "name", "text") + cf(t("phone"), "phone", "tel", "099 123 456") + cf(t("address"), "address", "text") +
        cf(t("email"), "email", "email") + cf(t("notes"), "notes", "text", t("notesPh")) +
        '<div class="actions"><button type="submit" class="primary">' + esc(t("save")) + "</button>" +
        (isNew ? "" : '<button type="button" class="danger" data-act="delclient">' + esc(t("del")) + "</button>") + "</div>" +
      "</form>" +
      (orders.length ? '<p class="hint">' + esc(t("clientOrders")) + '</p><div class="rows">' + orders.map(function (o) {
        return '<div class="row"><span>' + esc(orderLabel(o)) + '<span class="d">' + esc(new Date(o.savedAt || Date.now()).toLocaleDateString(loc())) + "</span></span><span>" + esc(money(compute(o).total)) + "</span></div>";
      }).join("") + '</div><p class="hint">' + esc(t("boughtTotal")) + ": " + esc(money(clientStats(c.id).sum)) + "</p>" : "") +
      '<button type="button" data-act="close">' + esc(t("close")) + "</button>");
  }

  // ---------- backup ----------
  function exportAll() {
    toast(t("working"));
    var ids = Object.keys(state.fileMeta);
    Promise.all(ids.map(function (id) {
      return fileGet(id).then(function (f) { return f ? blobToBase64(f.blob).then(function (b) { return { id: id, data: b }; }) : null; });
    })).then(function (files) {
      var data = JSON.stringify({ app: "tebacalc", v: 3, exportedAt: new Date().toISOString(), state: state, files: files.filter(Boolean) });
      var name = "TebaCalc-respaldo-" + new Date().toISOString().slice(0, 10) + ".json";
      return shareFiles("", [{ name: name, blob: new Blob([data], { type: "application/json" }) }], t("exportData")).then(function () { toast(t("exported")); });
    }).catch(function (e) { if (e && e.message === "noshare") toast(t("shareOnlyApp")); });
  }
  var pendingImport = null;
  function base64ToBlob(b64, type) {
    var bin = atob(b64), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: type || "" });
  }
  function applyImport() {
    var d = pendingImport; pendingImport = null;
    var old = Object.keys(state.fileMeta);
    Promise.all(old.map(fileDel)).then(function () {
      return Promise.all((d.files || []).map(function (f) {
        var meta = d.state.fileMeta[f.id] || {};
        return filePut({ id: f.id, blob: base64ToBlob(f.data, meta.type) });
      }));
    }).then(function () {
      state = d.state; state.example = false;
      if (!state.job) state.job = newOrder(state);
      Object.keys(urlCache).forEach(function (k) { URL.revokeObjectURL(urlCache[k]); }); urlCache = {};
      kvSet("state", state); closeSheet(); view = "calc"; render(); toast(t("importOk"));
    });
  }

  var toastTimer;
  function toast(msg) {
    var el = document.getElementById("toast");
    if (!el) { el = document.createElement("div"); el.id = "toast"; el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.hidden = true; }, 2400);
  }
  function copyText(text) {
    var fallback = function () {
      openSheet("<h3>" + esc(t("copyText")) + '</h3><p class="hint">' + esc(t("copyFallback")) + '</p><textarea class="copy" id="copybox" readonly>' + esc(text) + '</textarea><button type="button" data-act="close">' + esc(t("close")) + "</button>");
      var b = document.getElementById("copybox"); b.focus(); b.select();
    };
    try { navigator.clipboard.writeText(text).then(function () { toast(t("copied")); }, fallback); } catch (e) { fallback(); }
  }

  // ---------- events ----------
  function syncJobMaterials() {
    state.job.prints.forEach(function (p) { p.fil.forEach(function (f) { var m = findMat(f.mat); if (m) { f.price = m.price; f.weight = m.weight; f.color = m.color; } }); });
  }
  function markSyms() { main.querySelectorAll("[data-sym]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.sym === state.settings.sym)); }); }
  function refocus(id) { var pos; var el = document.getElementById(id); pos = el && el.selectionStart; render(); el = document.getElementById(id); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (x) {} } }

  main.addEventListener("input", function (e) {
    var el = e.target, d = el.dataset;
    if (view === "calc") {
      if (d.k) state.job[d.k] = el.value;
      if (d.pk) state.job.prints[+d.p][d.pk] = el.value;
      if (d.f) {
        var f = state.job.prints[+d.p].fil[+d.fi]; f[d.f] = el.value;
        if (d.f === "color") { var dot = document.getElementById("dot-" + d.p + "-" + d.fi); if (dot) dot.style.background = el.value; }
      }
      persist(); updatePrice();
    } else if (view === "history" && el.id === "h-search") { refocus("h-search"); }
    else if (view === "clients" && el.id === "c-search") { refocus("c-search"); }
    else if (view === "settings") {
      state.example = false;
      if (d.set) state.settings[d.set] = d.text ? el.value : num(el.value);
      if (d.s) {
        var box = el.closest(".fil"), item = state[box.dataset.coll][+box.dataset.i];
        item[d.s] = el.type === "text" || el.type === "color" ? el.value : num(el.value);
        if (d.s === "color") box.querySelector(".dot").style.background = el.value;
        syncJobMaterials();
      }
      if (el.id === "s-symc" && el.value.trim()) { state.settings.sym = el.value.trim(); markSyms(); }
      persist();
    }
  });
  main.addEventListener("change", function (e) {
    var el = e.target, d = el.dataset;
    if (el.id === "add-files" || el.id === "add-camera") { state.example = false; addFiles(el.files); el.value = ""; return; }
    if (view === "calc" && d.f === "mat") {
      var f = state.job.prints[+d.p].fil[+d.fi], m = findMat(el.value);
      f.mat = el.value; if (m) { f.price = m.price; f.weight = m.weight; f.color = m.color; }
      persist(); render();
    } else if (view === "calc" && (d.pk === "printer" || d.k === "clientId")) {
      persist(); updatePrice();
    } else if (view === "settings") {
      if (el.id === "s-dec") state.settings.dec = num(el.value);
      if (el.id === "s-lang") state.settings.lang = el.value;
      persist(); render();
    }
  });

  var armed = null;
  function arm(b) {
    if (armed === b) { armed = null; return true; }
    disarm(); armed = b; b.dataset.label = b.textContent; b.textContent = t("sure"); b.classList.add("armed"); return false;
  }
  function disarm() { if (armed) { armed.classList.remove("armed"); armed.textContent = armed.dataset.label; armed = null; } }

  main.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var act = b.dataset.act, d = b.dataset, j = state.job;
    if (d.sym) { state.example = false; state.settings.sym = d.sym; var c = document.getElementById("s-symc"); if (c) c.value = ""; persist(); render(); return; }
    if (act === "toggle") { var p = j.prints[+d.p]; p.open = !p.open; persist(); render(); return; }
    if (act === "addprint") { j.prints.forEach(function (x) { x.open = false; }); j.prints.push(newPrint(state, j.prints.length + 1)); persist(); render(); return; }
    if (act === "dupprint") { var cp = clone(j.prints[+d.p]); cp.id = uid(); cp.open = true; cp.name = cp.name ? cp.name + " (2)" : ""; j.prints[+d.p].open = false; j.prints.splice(+d.p + 1, 0, cp); persist(); render(); return; }
    if (act === "rmprint") { if (!arm(b)) return; j.prints.splice(+d.p, 1); persist(); render(); return; }
    if (act === "addfil") { j.prints[+d.p].fil.push(newFil(state)); persist(); render(); return; }
    if (act === "rmfil") { j.prints[+d.p].fil.splice(+d.fi, 1); persist(); render(); return; }
    if (act === "rmfile") { if (!arm(b)) return; var id = b.closest(".file").dataset.id; j.files = j.files.filter(function (x) { return x !== id; }); persist(); render(); gcFiles(); return; }
    if (act === "newclient") { clientForm(null); return; }
    if (act === "editclient") { clientForm(findClient(b.closest(".item").dataset.id)); return; }
    if (act === "orderfor") { state.example = false; state.job = newOrder(state, b.closest(".item").dataset.id); view = "calc"; persist(); render(); window.scrollTo(0, 0); return; }
    if (act === "addmat") { state.example = false; state.materials.push({ id: uid(), name: t("newMat"), type: "PLA", color: "#ffffff", price: 0, weight: 1000 }); persist(); render(); return; }
    if (act === "addprinter") { state.example = false; state.printers.push({ id: uid(), name: t("newPrinter"), watts: 120, price: 0, life: 5000, maint: 0 }); persist(); render(); return; }
    if (act === "rm") { if (!arm(b)) return; var box = b.closest(".fil"); state.example = false; state[box.dataset.coll].splice(+box.dataset.i, 1); persist(); render(); return; }
    if (act === "del") { if (!arm(b)) return; var hid = b.closest(".item").dataset.id; state.history = state.history.filter(function (h) { return h.id !== hid; }); persist(); render(); gcFiles(); return; }
    if (act === "open" || act === "sendorder") {
      var o = findIn(state.history, b.closest(".item").dataset.id);
      if (act === "sendorder") { showSend(o); return; }
      state.job = clone(o); state.job.prints[0].open = true; view = "calc"; persist(); render(); window.scrollTo(0, 0); return;
    }
    if (act === "export") { exportAll(); return; }
    if (act === "import") { document.getElementById("import-file").click(); return; }
  });
  document.addEventListener("click", function (e) { if (armed && e.target.closest("button") !== armed) disarm(); }, true);

  overlay.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]"); if (!el) return;
    var act = el.dataset.act;
    if (act === "close") { if (el.tagName === "BUTTON" || e.target === el) closeSheet(); return; }
    if (act === "save") { saveJob(); closeSheet(); toast(t("saved")); return; }
    if (act === "send") { saveJob(); showSend(state.job); return; }
    if (act === "new") { var keep = state.job.prints[0] && state.job.prints[0].printer; state.example = false; state.job = newOrder(state); if (findPrinter(keep)) state.job.prints[0].printer = keep; persist(); closeSheet(); render(); window.scrollTo(0, 0); gcFiles(); return; }
    if (act === "copytext") { copyText(document.getElementById("send-text").value); return; }
    if (act === "doshare") { doShare(); return; }
    if (act === "delclient") {
      if (!arm(el)) return;
      var cid = document.getElementById("client-form").dataset.id;
      state.clients = state.clients.filter(function (c) { return c.id !== cid; });
      if (state.job.clientId === cid) state.job.clientId = "";
      persist(); closeSheet(); render(); return;
    }
    if (act === "doimport") { applyImport(); return; }
  });
  overlay.addEventListener("change", function (e) { if (e.target.id === "send-img" || e.target.dataset.sendfile) syncSendButtons(); });
  overlay.addEventListener("input", function (e) { if (e.target.id === "send-text") syncSendButtons(); });
  overlay.addEventListener("submit", function (e) {
    if (e.target.id !== "client-form") return;
    e.preventDefault();
    var f = e.target, id = f.dataset.id, data = {};
    ["name", "phone", "address", "email", "notes"].forEach(function (k) { data[k] = f.elements[k].value.trim(); });
    if (!data.name) { toast(t("nameRequired")); return; }
    var c = findClient(id);
    if (c) Object.keys(data).forEach(function (k) { c[k] = data[k]; });
    else { c = data; c.id = uid(); c.created = Date.now(); state.clients.push(c); if (view === "calc") state.job.clientId = c.id; }
    state.example = false; persist(); closeSheet(); render();
  });
  document.getElementById("import-file").addEventListener("change", function (e) {
    var file = e.target.files && e.target.files[0]; e.target.value = "";
    if (!file) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var d = JSON.parse(rd.result);
        if (!d || d.app !== "tebacalc" || !d.state || !d.state.settings) throw 0;
        pendingImport = d;
        openSheet("<h3>" + esc(t("importData")) + '</h3><p class="hint">' + esc(t("importConfirm")) + "</p>" +
          '<p class="hint">' + esc((d.state.clients || []).length + " " + t("clients").toLowerCase() + " · " + (d.state.history || []).length + " " + t("ordersN") + " · " + (d.files || []).length + " 📎") + "</p>" +
          '<div class="actions"><button type="button" class="primary" data-act="doimport">' + esc(t("importDo")) + '</button><button type="button" data-act="close">' + esc(t("close")) + "</button></div>");
      } catch (x) { toast(t("importBad")); }
    };
    rd.readAsText(file);
  });
  // In the installed app, open WhatsApp links as a top-level navigation so Android hands them to WhatsApp.
  document.addEventListener("click", function (e) {
    var a = e.target.closest("a.wa"); if (!a || !cap()) return;
    e.preventDefault(); window.location.href = a.href;
  });
  document.getElementById("pb-btn").addEventListener("click", showBreakdown);
  document.getElementById("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("[data-view]"); if (!b) return;
    view = b.dataset.view; render(); window.scrollTo(0, 0);
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });

  // ---------- boot ----------
  idb().then(function () { return kvGet("state"); }).then(function (saved) {
    if (saved && saved.v === 3) state = saved;
    else {
      var legacy = null;
      try { legacy = JSON.parse(localStorage.getItem(LEGACY_KEY)); } catch (e) {}
      state = legacy && legacy.settings ? migrateV2(legacy) : defaults();
      if (!state.job) state.job = exampleOrder(state);
      kvSet("state", state);
    }
    ["clients", "history"].forEach(function (k) { if (!state[k]) state[k] = []; });
    if (!state.fileMeta) state.fileMeta = {};
    render();
  });
})();
</script>
