name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: TebaCalc-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk TebaCalc.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima TebaCalc.apk --target "$GITHUB_SHA" --prerelease \
            --title "TebaCalc (última compilación)" \
            --notes "Rama ${GITHUB_REF_NAME}, compilación ${GITHUB_RUN_NUMBER}. Descargá TebaCalc.apk e instalalo en Android."
